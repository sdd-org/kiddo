version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: generator
        versions: [">=0.8.12"]
      - dependency-name: ordered-float
        versions: [">=5.5.0"]

  - package-ecosystem: cargo
    directory: "/"
    target-branch: v5.x.x
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: generator
        versions: [">=0.8.12"]
      - dependency-name: ordered-float
        versions: [">=5.5.0"]
      - dependency-name: sorted-vec
        versions: [">=0.8.11"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: v5.x.x
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
